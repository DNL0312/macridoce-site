<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>macridoce | Bolos &amp; Confeitaria</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --cacau-intenso: #3B2014;
      --rosa-antigo: #E8AEB0;
      --creme-manteiga: #FDF6C9;
      --caramelo-tostado: #7D3418;
      --off-white: #FAF6F0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--off-white);
      background-image: radial-gradient(circle at top, var(--creme-manteiga) 0%, var(--off-white) 70%);
      color: var(--cacau-intenso);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background-color: #FFFFFF;
      padding: 40px 24px 32px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(59, 32, 20, 0.08);
      border: 1px solid rgba(232, 174, 176, 0.4);
    }

    .logo-wrapper {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      background-color: var(--caramelo-tostado);
      box-shadow: 0 6px 16px rgba(125, 52, 24, 0.2);
    }

    .logo-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--caramelo-tostado);
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.9rem;
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 32, 20, 0.14);
    }

    .btn-flor {
      flex: 0 0 24px;
      border-radius: 50%;
    }

    .btn-primary {
      background-color: var(--cacau-intenso);
      color: var(--rosa-antigo);
    }

    .btn-primary:hover {
      background-color: #2c170e;
    }

    .btn-secondary {
      background-color: var(--caramelo-tostado);
      color: var(--creme-manteiga);
    }

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid rgba(59, 32, 20, 0.08);
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .footer a {
      color: var(--caramelo-tostado);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo-wrapper">
      <img
        src="logo.webp"
        width="112"
        height="112"
        alt=""
      >
    </div>

    <h1>macridoce</h1>
    <p class="subtitle">Bolos &amp; Confeitaria</p>

    <p class="bio">
      Especialista em bolos de aniversário com acabamento em chantilly de bico.
      Recheios variados e compotas de fabricação própria.
      Atendendo em Petrolina–PE e região.
    </p>

    <div class="links">
      <a
        href="https://api.whatsapp.com/send/?phone=5587981683625&amp;text&amp;type=phone_number&amp;app_absent=0"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary"
      >
        <img class="btn-flor" src="iconflower.webp" width="24" height="24" alt="">
        <span>Encomendas &amp; Orçamentos</span>
      </a>

      <a
        href="tabeladevalores.jpg"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-secondary"
      >
        <img class="btn-flor" src="iconflower.webp" width="24" height="24" alt="">
        <span>Cardápio de Massas &amp; Recheios</span>
      </a>
    </div>

    <footer class="footer">
      <p>
        <a href="https://www.instagram.com/macridoce/" target="_blank" rel="noopener noreferrer">@macridoce</a>
        • Petrolina – PE
      </p>
    </footer>
  </main>
</body>
</html>
